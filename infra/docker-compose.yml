services:
  # pgvector, not a separate vector database. The symbol graph is relational —
  # "who calls this" is a recursive CTE — and putting the embeddings in the same
  # Postgres means a retrieval and a graph hop are one query, not two round
  # trips against two systems that can disagree about what is indexed.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: codetrail
      POSTGRES_PASSWORD: codetrail
      POSTGRES_DB: codetrail
    ports: ["55432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrail -d codetrail"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pinned to a digest, not to a tag. The eval's headline claim is that its
  # numbers are reproducible, and a floating tag silently re-embeds the whole
  # corpus under a new model: measured on 2026-09-01, ollama/ollama:latest had
  # already moved to sha256:020e4134… while the container serving this project
  # was still 0.33.0. The tag is here for a reader; the digest is what resolves.
  ollama:
    image: ollama/ollama:0.33.0@sha256:08ddf4b4dbfdc4fc1f5b0fe535915998581085402e307b57bb308db68460e372
    ports: ["11435:11434"]
    volumes: ["ollama:/root/.ollama"]
    profiles: ["ai"]

volumes:
  pg:
  ollama:
