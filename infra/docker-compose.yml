services:
  # pgvector, not a separate vector database. The symbol graph is relational —
  # "who calls this" is a recursive CTE — and putting the embeddings in the same
  # Postgres means a retrieval and a graph hop are one query, not two round
  # trips against two systems that can disagree about what is indexed.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: codetrail
      POSTGRES_PASSWORD: codetrail
      POSTGRES_DB: codetrail
    ports: ["55432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrail -d codetrail"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pinned to a digest, not to a tag. The eval's headline claim is that its
  # numbers are reproducible, and a floating tag silently re-embeds the whole
  # corpus under a new model: measured on 2026-09-01, ollama/ollama:latest had
  # already moved to sha256:020e4134… while the container serving this project
  # was still 0.33.0. The tag is here for a reader; the digest is what resolves.
  ollama:
    image: ollama/ollama:0.33.0@sha256:08ddf4b4dbfdc4fc1f5b0fe535915998581085402e307b57bb308db68460e372
    ports: ["11435:11434"]
    volumes: ["ollama:/root/.ollama"]
    networks: [data]
    profiles: ["ai"]

  # The two application images, behind a profile so `make up` stays a database
  # and nothing else. Two networks rather than one, because §2 makes the split a
  # deployment boundary: compose cannot give them different egress, and saying
  # so is better than implying parity — what it can express is that the indexer
  # is on no network the gateway can reach it from.
  gateway:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    image: codetrail/gateway:dev
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://codetrail:codetrail@postgres:5432/codetrail?sslmode=disable
      EMBED_PROVIDER: ${EMBED_PROVIDER:-fake}
      OLLAMA_URL: http://ollama:11434
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "/gateway", "-probe"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [edge, data]
    profiles: ["apps"]

  indexer:
    build:
      context: ..
      dockerfile: infra/indexer.Dockerfile
    image: codetrail/indexer:dev
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://codetrail:codetrail@postgres:5432/codetrail?sslmode=disable
      EMBED_PROVIDER: ${EMBED_PROVIDER:-fake}
      OLLAMA_URL: http://ollama:11434
      ALLOWED_HOSTS: github.com,codeberg.org
    ports: ["9090:9090"]
    read_only: true
    # The two writable paths, and no others: the same surface Task 5's task
    # definition gives it.
    tmpfs: ["/scratch:mode=1777", "/tmp:mode=1777"]
    healthcheck:
      test: ["CMD", "/indexer", "-probe"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [data]
    profiles: ["apps"]

networks:
  edge:
  data:

volumes:
  pg:
  ollama:
