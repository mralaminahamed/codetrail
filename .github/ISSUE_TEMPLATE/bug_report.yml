name: Bug report
description: Report something in codetrail that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form; follow the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error output or response body.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests or console steps, and the repository you indexed if relevant.
      placeholder: |
        1. make up && make build
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway
        - indexer
        - console
        - evalrunner
        - infrastructure
        - other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The `trunk` commit you ran (`git rev-parse HEAD`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go and Node versions, and any non-default configuration (never paste API keys).
