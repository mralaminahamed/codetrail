name: CI

on:
  push: { branches: [trunk] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codetrail
          POSTGRES_PASSWORD: codetrail
          POSTGRES_DB: codetrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codetrail -d codetrail"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://codetrail:codetrail@127.0.0.1:5432/codetrail?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27", cache: true }
      - name: gofmt
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }
      - name: vet
        run: go vet ./...
      # The ollama-tagged suite needs a model, so CI never runs it — and until
      # this step, nothing compiled it either. `go vet ./...` skips a tagged
      # file, so an API change in packages/shared/embed could break the one
      # check a fake cannot make and stay green for as long as nobody ran it by
      # hand. This costs no model and no server: it type-checks and returns.
      - name: vet (ollama tag)
        run: go vet -tags=ollama ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      # The tests that matter most. Every hermetic test in the tree can pass
      # against a schema Postgres would reject.
      #
      # Spec §9 requires the harness to run with no model. EMBED_PROVIDER is
      # written out rather than left to a default, and it changes nothing about
      # the run: the two live suites that build an embedder — apps/indexer/cmd
      # and apps/gateway/internal/handler — default to the fake themselves and
      # refuse any other provider, and the store and jobs suites never construct
      # one at all. It is here as the intent, visible in the log next to the run
      # it describes.
      #
      # What a green run here proves as of P3: the whole read path — both
      # retrieval arms, fusion, the floor, an extractive answer and its
      # citations — over a live Postgres, on the deterministic fake.
      #
      # What it cannot prove: that fusion retrieves better. embed.Fake is a
      # hashed bag of words over the same span text the lexical arm indexes, so
      # in CI the two arms are near-duplicates of one function and every
      # end-to-end score is lexical overlap wearing a similarity's clothes.
      # These are mechanics, and spec §9's banner — "the figures that run prints
      # are not quality" — is the sentence to read a green build with.
      #
      # The retrieval knobs are deliberately NOT set here, against this plan's
      # own instruction, and the reason is measured rather than argued:
      # newRetriever reads the ambient environment, and apps/gateway/cmd's tests
      # run in both steps below and above. `RETRIEVAL_MODE=lexical go test
      # ./apps/gateway/cmd/` fails TestTheDefaultRetrieverIsHybridAtTheUncalibratedFloor
      # with "mode=lexical", and `ANSWER_SCORE_FLOOR=0.35` fails it with
      # "floor {Value:0.35 …}". So exporting the shipped defaults here would
      # leave that test green while it asserted this file instead of the code —
      # and the mutation that flips the default in main.go would survive in CI
      # and die only on a developer's machine.
      # Expand-only from P8 forward, enforced rather than written down.
      # migrate() runs at boot inside the new task while the old one is still
      # serving, and a rollback moves the task definition and never the schema.
      - name: migrations are expand-only
        run: make migrations-lint

      # Four Terraform steps, all with no AWS account and no credentials that
      # resolve to anything. The stack has no data source that calls the API,
      # which is what makes a plan — and therefore every assertion over it —
      # something a pull request can run.
      #
      # tfplan and tfplan.json hold every secret this stack has in cleartext.
      # They stay on the runner: never uploaded, never printed.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt, validate
        run: make tf-check
      - name: terraform plan, offline
        run: make tf-plan
      # Vetted under its own tag for the reason the ollama suite is: `go vet
      # ./...` skips a tagged file, so this suite could rot between runs.
      - name: plan policy suite
        run: |
          go vet -tags=tfplan ./infra/...
          go test -tags=tfplan -count=1 ./infra/policy/

      # promtool has no cloud account and needs none: it parses the rules and
      # replays a synthetic series through them. The test rules are what turn
      # "the conjunct is there" into "the conjunct decides the outcome" —
      # `promtool check rules` cannot tell a real metric from a typo, and it
      # passes an unfireable rule.
      - name: prometheus rules
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          make alerts-test
        env:
          PROMETHEUS_VERSION: 3.14.0

      # Both images, on every pull request. The properties the sandbox depends
      # on — one go on PATH, no inherited GO*/GIT_*/*_PROXY, non-root under a
      # read-only root filesystem, a readable RDS trust store — are facts about
      # a built artifact, and nothing in the Go suite can see them.
      - name: image assertions
        run: ./infra/image_test.sh

      # The whole path, against the images built above: admission refuses an
      # unlisted forge, a real public repository indexes end to end, call edges
      # resolve, and a citation names the commit that was indexed.
      #
      # EMBED_PROVIDER=fake, said explicitly. Step 6 indexes a real repository
      # and something has to embed it; the alternative under compose is an
      # Ollama plus a ~274 MB model pull on every pull request. It is the same
      # choice the live suites already make, and it is banned only in the cloud,
      # where meaningless retrieval would sit behind a wall of 200s. Nothing
      # this asserts depends on embedding quality: edges_resolved depends on the
      # Go toolchain and the citation check on the commit, not on the ranking.
      - name: smoke test over compose
        env:
          EMBED_PROVIDER: fake
        run: |
          docker tag codetrail/gateway:test codetrail/gateway:dev
          docker tag codetrail/indexer:test codetrail/indexer:dev
          docker compose -f infra/docker-compose.yml --profile apps up -d --no-build
          ./infra/smoke.sh --target compose http://localhost:8080

      - name: live datastore tests
        env:
          EMBED_PROVIDER: fake
        run: go test -tags=live -count=1 -v ./...
