name: CI

on:
  push: { branches: [trunk] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codetrail
          POSTGRES_PASSWORD: codetrail
          POSTGRES_DB: codetrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codetrail -d codetrail"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://codetrail:codetrail@127.0.0.1:5432/codetrail?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27", cache: true }
      - name: gofmt
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }
      - name: vet
        run: go vet ./...
      # The ollama-tagged suite needs a model, so CI never runs it — and until
      # this step, nothing compiled it either. `go vet ./...` skips a tagged
      # file, so an API change in packages/shared/embed could break the one
      # check a fake cannot make and stay green for as long as nobody ran it by
      # hand. This costs no model and no server: it type-checks and returns.
      - name: vet (ollama tag)
        run: go vet -tags=ollama ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      # The tests that matter most. Every hermetic test in the tree can pass
      # against a schema Postgres would reject.
      #
      # Spec §9 requires the harness to run with no model. EMBED_PROVIDER is
      # written out rather than left to a default, and it changes nothing about
      # the run: the two live suites that build an embedder — apps/indexer/cmd
      # and apps/gateway/internal/handler — default to the fake themselves and
      # refuse any other provider, and the store and jobs suites never construct
      # one at all. It is here as the intent, visible in the log next to the run
      # it describes.
      #
      # What a green run here proves as of P3: the whole read path — both
      # retrieval arms, fusion, the floor, an extractive answer and its
      # citations — over a live Postgres, on the deterministic fake.
      #
      # What it cannot prove: that fusion retrieves better. embed.Fake is a
      # hashed bag of words over the same span text the lexical arm indexes, so
      # in CI the two arms are near-duplicates of one function and every
      # end-to-end score is lexical overlap wearing a similarity's clothes.
      # These are mechanics, and spec §9's banner — "the figures that run prints
      # are not quality" — is the sentence to read a green build with.
      #
      # The retrieval knobs are deliberately NOT set here, against this plan's
      # own instruction, and the reason is measured rather than argued:
      # newRetriever reads the ambient environment, and apps/gateway/cmd's tests
      # run in both steps below and above. `RETRIEVAL_MODE=lexical go test
      # ./apps/gateway/cmd/` fails TestTheDefaultRetrieverIsHybridAtTheUncalibratedFloor
      # with "mode=lexical", and `ANSWER_SCORE_FLOOR=0.35` fails it with
      # "floor {Value:0.35 …}". So exporting the shipped defaults here would
      # leave that test green while it asserted this file instead of the code —
      # and the mutation that flips the default in main.go would survive in CI
      # and die only on a developer's machine.
      - name: live datastore tests
        env:
          EMBED_PROVIDER: fake
        run: go test -tags=live -count=1 -v ./...

      # Spec §9's mechanics check, run as its own step so its position is
      # visible: the two guards below have to come *after* it, or they check a
      # repository the eval has not written to yet. The live step above already
      # runs this suite; the second it costs buys an ordering a reader
      # can see.
      #
      # The retrieval knobs are passed by the suite itself (t.Setenv), not as
      # job-level env, for the reason the block above gives: newRetriever reads
      # the ambient environment and apps/gateway/cmd's tests run in this same
      # job, so exporting the shipped defaults here would leave
      # TestTheDefaultRetrieverIsHybridAtTheUncalibratedFloor asserting this
      # file instead of the code. The suite writes its artefact to a temporary
      # directory: a CI job that commits a measurement is a CI job that
      # publishes a fake one.
      - name: eval harness on the fake embedder (mechanics only)
        run: go test -tags=live -count=1 -v -run Live ./apps/evalrunner/...
      # Two guards, both after the eval. The first is the repository-walking
      # test; the second is what actually catches an *untracked* artefact,
      # which the first cannot see. docs/eval/mechanics/ is gitignored so a
      # deliberate local mechanics run does not trip it.
      - name: no mechanics run reached the repository
        run: |
          go test -run TestNoMechanicsRunIsCommittedAsAMeasurement ./apps/evalrunner/cmd/ -count=1
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
