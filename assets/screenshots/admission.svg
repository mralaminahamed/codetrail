<text x="44.8" y="62" fill="#c9d1d9" xml:space="preserve">for u in &quot;${URLS[@]}&quot;; do curl -s -XPOST localhost:8080/api/repos -d &quot;{\&quot;remote\&quot;:\&quot;$u\&quot;,\&quot;ref\&quot;:\&quot;main\&quot;}&quot;; done</text>
