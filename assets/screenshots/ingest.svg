<text x="503.5" y="25" fill="#8b949e" font-size="12" text-anchor="middle">codetrail — indexing a stranger&#x27;s repository, end to end</text>
<text x="28.0" y="62" fill="#7ee787" xml:space="preserve">$ </text>
<text x="44.8" y="62" fill="#c9d1d9" xml:space="preserve">curl -s -XPOST localhost:8080/api/repos -d &#x27;{&quot;remote&quot;:&quot;https://github.com/octocat/Hello-World&quot;,&quot;ref&quot;:&quot;master&quot;}&#x27;</text>
<text x="28.0" y="88" fill="#8b949e" xml:space="preserve">{</text>
<text x="36.4" y="88" fill="#8b949e" xml:space="preserve">&quot;id&quot;:</text>
<text x="78.5" y="88" fill="#c9d1d9" xml:space="preserve">&quot;8e9c5ba3dd655030&quot;</text>
<text x="230.1" y="88" fill="#8b949e" xml:space="preserve">,</text>
<text x="238.5" y="88" fill="#8b949e" xml:space="preserve">&quot;remote&quot;:</text>
<text x="314.3" y="88" fill="#79c0ff" xml:space="preserve">&quot;https://github.com/octocat/Hello-World&quot;</text>
<text x="651.1" y="88" fill="#8b949e" xml:space="preserve">,</text>
<text x="659.5" y="88" fill="#8b949e" xml:space="preserve">&quot;ref&quot;:</text>
<text x="710.0" y="88" fill="#c9d1d9" xml:space="preserve">&quot;master&quot;</text>
<text x="777.4" y="88" fill="#8b949e" xml:space="preserve">,</text>
<text x="785.8" y="88" fill="#8b949e" xml:space="preserve">&quot;status&quot;:</text>
<text x="861.6" y="88" fill="#7ee787" xml:space="preserve">&quot;pending&quot;</text>
<text x="937.4" y="88" fill="#8b949e" xml:space="preserve">}</text>
<text x="28.0" y="140" fill="#7ee787" xml:space="preserve">$ </text>
<text x="44.8" y="140" fill="#c9d1d9" xml:space="preserve">while :; do curl -s localhost:8080/api/jobs/8e9c5ba3dd655030; sleep 2; done</text>
<text x="28.0" y="166" fill="#8b949e" xml:space="preserve">{</text>
<text x="36.4" y="166" fill="#8b949e" xml:space="preserve">&quot;id&quot;:</text>
<text x="78.5" y="166" fill="#c9d1d9" xml:space="preserve">&quot;8e9c5ba3dd655030&quot;</text>
<text x="230.1" y="166" fill="#8b949e" xml:space="preserve">,</text>
<text x="238.5" y="166" fill="#8b949e" xml:space="preserve">&quot;remote&quot;:</text>
<text x="314.3" y="166" fill="#79c0ff" xml:space="preserve">&quot;https://github.com/octocat/Hello-World&quot;</text>
<text x="651.1" y="166" fill="#8b949e" xml:space="preserve">,</text>
<text x="659.5" y="166" fill="#8b949e" xml:space="preserve">&quot;ref&quot;:</text>
<text x="710.0" y="166" fill="#c9d1d9" xml:space="preserve">&quot;master&quot;</text>
<text x="777.4" y="166" fill="#8b949e" xml:space="preserve">,</text>
<text x="785.8" y="166" fill="#8b949e" xml:space="preserve">&quot;status&quot;:</text>
<text x="861.6" y="166" fill="#7ee787" xml:space="preserve">&quot;leased&quot;</text>
<text x="928.9" y="166" fill="#8b949e" xml:space="preserve">}</text>
<text x="28.0" y="192" fill="#8b949e" xml:space="preserve">{</text>
<text x="36.4" y="192" fill="#8b949e" xml:space="preserve">&quot;id&quot;:</text>
<text x="78.5" y="192" fill="#c9d1d9" xml:space="preserve">&quot;8e9c5ba3dd655030&quot;</text>
<text x="230.1" y="192" fill="#8b949e" xml:space="preserve">,</text>
<text x="238.5" y="192" fill="#8b949e" xml:space="preserve">&quot;remote&quot;:</text>
<text x="314.3" y="192" fill="#79c0ff" xml:space="preserve">&quot;https://github.com/octocat/Hello-World&quot;</text>
<text x="651.1" y="192" fill="#8b949e" xml:space="preserve">,</text>
<text x="659.5" y="192" fill="#8b949e" xml:space="preserve">&quot;ref&quot;:</text>
<text x="710.0" y="192" fill="#c9d1d9" xml:space="preserve">&quot;master&quot;</text>
<text x="777.4" y="192" fill="#8b949e" xml:space="preserve">,</text>
<text x="785.8" y="192" fill="#8b949e" xml:space="preserve">&quot;status&quot;:</text>
<text x="861.6" y="192" fill="#7ee787" xml:space="preserve">&quot;done&quot;</text>
<text x="912.1" y="192" fill="#8b949e" xml:space="preserve">}</text>
<text x="28.0" y="244" fill="#8b949e" xml:space="preserve"># The same repository, spelled differently. Identity folds case and .git;</text>
<text x="28.0" y="270" fill="#8b949e" xml:space="preserve"># the row keeps the spelling the first submitter used.</text>
<text x="28.0" y="296" fill="#7ee787" xml:space="preserve">$ </text>
<text x="44.8" y="296" fill="#c9d1d9" xml:space="preserve">curl -s -XPOST localhost:8080/api/repos -d &#x27;{&quot;remote&quot;:&quot;https://GitHub.com/OctoCat/hello-world.git&quot;,...}&#x27;</text>
<text x="28.0" y="348" fill="#7ee787" xml:space="preserve">$ </text>
<text x="44.8" y="348" fill="#c9d1d9" xml:space="preserve">psql -c &#x27;SELECT remote, substr(commit_sha,1,8), size_bytes FROM repos&#x27;</text>
<text x="28.0" y="374" fill="#8b949e" xml:space="preserve">                remote                 |  commit  | size_bytes</text>
<text x="28.0" y="400" fill="#8b949e" xml:space="preserve"> https://github.com/octocat/Hello-World | 7fd1a60b |      30198</text>
<text x="28.0" y="426" fill="#8b949e" xml:space="preserve">(1 row)</text>
<text x="28.0" y="478" fill="#8b949e" xml:space="preserve"># KEEP_REPOS=1, then index a second repository. Eviction is one DELETE</text>
<text x="28.0" y="504" fill="#8b949e" xml:space="preserve"># that cascades to files and spans; job history is kept.</text>
<text x="28.0" y="530" fill="#7ee787" xml:space="preserve">$ </text>
<text x="44.8" y="530" fill="#c9d1d9" xml:space="preserve">psql -c &#x27;SELECT remote, substr(commit_sha,1,8), size_bytes FROM repos&#x27;</text>
<text x="28.0" y="556" fill="#8b949e" xml:space="preserve">                remote                 |  commit  | size_bytes</text>
<text x="28.0" y="582" fill="#8b949e" xml:space="preserve"> https://github.com/octocat/Spoon-Knife | d0dd1f61 |      32636</text>
<text x="28.0" y="608" fill="#8b949e" xml:space="preserve">(1 row)</text>
<text x="28.0" y="660" fill="#8b949e" xml:space="preserve">files rows: 3        jobs: 3 (history kept)</text>
</svg>