<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f4655"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </linearGradient>
    <radialGradient id="sheen" cx="512" cy="300" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-45%" width="150%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0d11" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- macOS squircle, matching the sibling projects' icons -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#sheen)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="224" ry="224" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>

  <g filter="url(#glow)">
    <!-- Lines of code. The two amber ones are the cited span: a citation here
         is a line range, not a whole file. -->
    <rect x="286" y="286" width="392" height="52" rx="26" fill="#ffffff" fill-opacity="0.40"/>
    <rect x="286" y="392" width="300" height="52" rx="26" fill="#ffffff" fill-opacity="0.40"/>
    <rect x="286" y="498" width="452" height="52" rx="26" fill="#e8a33f"/>
    <rect x="286" y="604" width="356" height="52" rx="26" fill="#e8a33f"/>
    <rect x="286" y="710" width="264" height="52" rx="26" fill="#ffffff" fill-opacity="0.40"/>

    <!-- The bracket marking where the span starts and ends. -->
    <path d="M214 484 h-28 a18 18 0 0 0 -18 18 v152 a18 18 0 0 0 18 18 h28"
      fill="none" stroke="#e8a33f" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
